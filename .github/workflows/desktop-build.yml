name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win -- --publish never
            artifact: PDF-Tanpa-Kunci-Windows
            files: dist/*.exe
          - os: macos-latest
            command: npm run dist:mac -- --publish never
            artifact: PDF-Tanpa-Kunci-macOS
            files: dist/*.dmg

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate qpdf WebAssembly
        run: node -e "const fs=require('fs'); WebAssembly.compile(fs.readFileSync('qpdf.wasm')).then(()=>console.log('qpdf.wasm valid')).catch(error=>{console.error(error);process.exit(1)})"

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
